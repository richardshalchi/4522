<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Simulation - Research Study</title>
<style>
  :root {
    --bg-color: #000;
    --card-bg: #111;
    --accent: #fe2c55;
    --dislike-accent: #3a86ff;
    --text: #fff;
    --glass-bg: rgba(22, 22, 22, 0.85);
    --glass-border: rgba(255, 255, 255, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #121212; color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  
  /* Setup Screen */
  #setup-screen { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  #setup-screen h2 { margin-bottom: 20px; text-align: center; color: #fff; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
  .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; }
  button.btn-primary { width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--accent); color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
  button.btn-primary:hover { opacity: 0.9; }
  button.btn-secondary { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; background: #2a2a2a; color: #ddd; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 10px; }
  button.btn-secondary:hover { background: #333; }

  /* Feed Container */
  #app-container { display: none; width: 100%; max-width: 400px; height: 750px; background: var(--bg-color); border-radius: 16px; overflow: hidden; position: relative; border: 2px solid #333; }
  
  /* Header Bar with Timer, End Block, and Reload Button */
  .header-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.88), transparent);
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .timer-pill {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #eee;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .end-block-btn {
    background: rgba(254, 44, 85, 0.22);
    border: 1px solid rgba(254, 44, 85, 0.65);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .end-block-btn:hover {
    background: var(--accent);
  }
  .refresh-btn {
    background: none;
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    padding: 5px;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  .refresh-btn:hover { opacity: 1; }

  /* Video Deck */
  .feed-viewport { width: 100%; height: 100%; overflow: hidden; position: relative; }
  .video-card { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

  /* Action Buttons (Right Overlay) */
  .ui-overlay { 
    position: absolute; 
    right: 12px; 
    bottom: 85px; 
    display: flex; 
    flex-direction: column; 
    gap: 14px; 
    z-index: 5; 
    align-items: center; 
  }
  
  /* Profile Avatar Follow Button */
  .profile-btn {
    position: relative;
    width: 48px;
    height: 48px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .profile-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #333;
    border: 2px solid #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    overflow: hidden;
  }
  .follow-badge {
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: white;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    font-weight: bold;
    border: 2px solid #000;
    transition: all 0.2s ease;
  }
  .profile-btn.is-following .follow-badge {
    background: #2ec4b6;
  }
  .profile-btn.is-following .profile-avatar {
    border-color: #2ec4b6;
  }

  /* Standard Action Buttons */
  .action-btn { background: rgba(0,0,0,0.45); border: none; color: white; width: 46px; height: 46px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; backdrop-filter: blur(5px); }
  .action-btn.active-like { color: var(--accent); }
  .action-btn.active-dislike { color: var(--dislike-accent); }
  .action-btn.active-generic { color: #ffd166; }
  .action-btn span { font-size: 8px; margin-top: 2px; }

  /* Metadata Text */
  .video-info { 
    position: absolute; 
    bottom: 60px; 
    left: 0; 
    right: 0; 
    padding: 15px;
    padding-right: 70px; 
    z-index: 5; 
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); 
    pointer-events: none;
  }
  .video-author {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .video-info h4 { font-size: 14px; font-weight: 400; color: #eee; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

  /* Bottom Navigation Bar */
  .nav-controls { 
    position: absolute; 
    bottom: 0; 
    left: 0; 
    right: 0; 
    height: 60px; 
    background: rgba(0,0,0,0.95); 
    display: flex; 
    justify-content: space-around; 
    align-items: center; 
    z-index: 10; 
    border-top: 1px solid #222;
  }
  .nav-btn { background: #222; border: 1px solid #444; color: white; font-weight: bold; cursor: pointer; padding: 8px 16px; border-radius: 20px; font-size: 12px; }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* In-Feed Probe Modal Overlay */
  #probe-modal {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 30;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
  }
  .probe-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 24px 18px;
    width: 100%;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  }
  .probe-card h3 {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .likert-scale {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 12px;
  }
  .likert-btn {
    flex: 1;
    padding: 12px 0;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .likert-btn:hover {
    background: var(--accent);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .likert-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #aaa;
    margin-top: 4px;
  }

  /* Comments Drawer Overlay */
  #comments-drawer {
    display: none;
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 450px;
    background: rgba(18, 18, 18, 0.95);
    backdrop-filter: blur(15px);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    z-index: 40;
    flex-direction: column;
    border-top: 1px solid #333;
    animation: slideUp 0.3s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .comments-header {
    padding: 15px;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 1px solid #2a2a2a;
    position: relative;
  }
  .close-comments {
    position: absolute;
    right: 15px;
    top: 15px;
    background: none;
    border: none;
    color: #aaa;
    font-size: 16px;
    cursor: pointer;
  }
  .comments-list {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .comment-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .comment-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .comment-content {
    flex: 1;
    font-size: 13px;
  }
  .comment-user {
    font-weight: 600;
    color: #aaa;
    margin-bottom: 2px;
  }
  .comment-text {
    color: #eee;
    line-height: 1.3;
  }
  .comment-like-btn {
    background: none;
    border: none;
    color: #aaa;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 0 5px;
  }
  .comment-like-btn.liked {
    color: var(--accent);
  }

  /* Share Modal Overlay */
  #share-modal {
    display: none;
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(22, 22, 22, 0.98);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    z-index: 40;
    padding: 25px 20px 40px 20px;
    text-align: center;
    border-top: 1px solid #333;
    animation: slideUp 0.3s ease-out;
  }
  #share-modal h3 {
    font-size: 15px;
    margin-bottom: 20px;
    color: #fff;
  }
  .share-options {
    display: flex;
    justify-content: space-around;
    gap: 15px;
  }
  .share-option-btn {
    background: #2a2a2a;
    border: 1px solid #444;
    color: white;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    transition: background 0.2s, border-color 0.2s;
  }
  .share-option-btn:hover, .share-option-btn.selected {
    background: #333;
    border-color: var(--accent);
  }
  .share-option-btn span.icon {
    font-size: 24px;
  }
  .cancel-share-btn {
    margin-top: 20px;
    background: none;
    border: none;
    color: #aaa;
    font-size: 14px;
    cursor: pointer;
  }

  /* End Screen */
  #end-screen { display: none; text-align: center; background: #1e1e1e; padding: 30px; border-radius: 12px; max-width: 420px; width: 100%; }
  #end-screen h2 { margin-bottom: 10px; }
  #end-screen p { color: #aaa; margin-bottom: 14px; line-height: 1.45; }
  #upload-status { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #272727; color: #ddd; margin-bottom: 16px; }
</style>
</head>
<body>

  <!-- Setup Screen -->
  <div id="setup-screen">
    <h2>Session Setup</h2>
    <div class="form-group">
      <label for="participant-id">Participant ID</label>
      <input type="text" id="participant-id" placeholder="e.g., P01" value="P01">
    </div>
    <div class="form-group">
      <label for="condition-select">Condition Block</label>
      <select id="condition-select">
        <option value="Aligned">A</option>
        <option value="Misaligned">B</option>
        <option value="Non-Responsive">C</option>
      </select>
    </div>
    <button class="btn-primary" onclick="startSession()">Start Condition Block (7:00)</button>
  </div>

  <!-- Main Feed App -->
  <div id="app-container">
    <div class="header-bar">
      <div class="header-left">
        <div class="timer-pill" id="block-timer">07:00</div>
        <button class="end-block-btn" onclick="endSession('manual_end_block')">End Block</button>
      </div>
      <button class="refresh-btn" onclick="refreshFeed()" title="Refresh Feed">🔄</button>
    </div>

    <!-- In-Feed Probe Modal -->
    <div id="probe-modal">
      <div class="probe-card">
        <h3>How much are your actions shaping this feed right now?</h3>
        <div class="likert-scale">
          <button class="likert-btn" onclick="submitProbe(1)">1</button>
          <button class="likert-btn" onclick="submitProbe(2)">2</button>
          <button class="likert-btn" onclick="submitProbe(3)">3</button>
          <button class="likert-btn" onclick="submitProbe(4)">4</button>
          <button class="likert-btn" onclick="submitProbe(5)">5</button>
          <button class="likert-btn" onclick="submitProbe(6)">6</button>
          <button class="likert-btn" onclick="submitProbe(7)">7</button>
        </div>
        <div class="likert-labels">
          <span>1 - Not at all</span>
          <span>4 - Neutral</span>
          <span>7 - Completely</span>
        </div>
      </div>
    </div>

    <!-- Comments Drawer -->
    <div id="comments-drawer">
      <div class="comments-header">
        <span id="comments-title-count">Comments</span>
        <button class="close-comments" onclick="closeComments()">✕</button>
      </div>
      <div class="comments-list" id="comments-list-container">
        <!-- Dynamically injected comments -->
      </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal">
      <h3>Share this video</h3>
      <div class="share-options">
        <button class="share-option-btn" id="btn-share-friends" onclick="executeShare('share_to_friends')">
          <span class="icon">👥</span>
          <span>Share to Friends</span>
        </button>
        <button class="share-option-btn" id="btn-repost" onclick="executeShare('repost_to_feed')">
          <span class="icon">🔄</span>
          <span>Repost to Feed</span>
        </button>
      </div>
      <button class="cancel-share-btn" onclick="closeShareModal()">Cancel</button>
    </div>

    <div class="feed-viewport">
      <div class="video-card" id="current-card">
        <video id="feed-video" loop autoplay muted playsinline onclick="togglePlayPause()"></video>
        
        <div class="video-info">
          <div class="video-author" id="video-author">@username</div>
          <h4 id="video-title">Video Title</h4>
        </div>

        <div class="ui-overlay">
          <div class="profile-btn" id="profile-btn" onclick="toggleFollow()">
            <div class="profile-avatar">👤</div>
            <div class="follow-badge" id="follow-badge">+</div>
          </div>
          <button class="action-btn" id="like-btn" onclick="toggleLike()">❤️ <span>Like</span></button>
          <button class="action-btn" id="comment-btn" onclick="openComments()">💬 <span>Comments</span></button>
          <button class="action-btn" id="dislike-btn" onclick="toggleDislike()">🚫 <span>Not Interested</span></button>
          <button class="action-btn" id="save-btn" onclick="toggleSave()">🔖 <span>Save</span></button>
          <button class="action-btn" id="share-btn" onclick="openShareModal()">🔗 <span>Share</span></button>
        </div>
      </div>
    </div>

    <div class="nav-controls">
      <button class="nav-btn" id="prev-btn" onclick="prevVideo()" disabled>⬆️ Previous</button>
      <button class="nav-btn" onclick="nextVideo()">Next ⬇️</button>
    </div>
  </div>

  <!-- End Screen -->
  <div id="end-screen">
    <h2>Condition Block Complete</h2>
    <p>Session data is being sent to the study cloud folder.</p>
    <div id="upload-status">Preparing upload...</div>

    let sessionData = [];
    let participantId = "";
    let condition = "Aligned";
    let activeQueue = []; 
    let queueIndex = 0;   
    let sequencePosition = 0;
    let videoStartTime = 0;
    let loopCount = 0;
    let userCategoryPreferences = {}; 
    let isLiked = false, isDisliked = false, isSaved = false, isFollowed = false, hasOpenedCommentsThisView = false;
    let viewedIndices = new Set();
    let viewHistory = [];
    let currentPostComments = [];
    let remainingSeconds = BLOCK_DURATION_SECONDS;
    let timerInterval = null;
    let sessionEnded = false;

    // Background preloader for the upcoming video
    const preloaderVideo = document.createElement("video");
    preloaderVideo.preload = "auto";
    preloaderVideo.muted = true;
    preloaderVideo.playsInline = true;

    function cleanupActiveVideo() {
      const videoElem = document.getElementById('feed-video');
      if (!videoElem) return;
      videoElem.pause();
      try {
        videoElem.currentTime = 0;
      } catch (e) {
        // Ignore seek errors before metadata is loaded
      }
      videoElem.removeAttribute('src');
      videoElem.load();
    }

    function predictNextQueueIndex() {
      if (!activeQueue.length) return -1;
      if (viewedIndices.size >= activeQueue.length) return 0;

      if (condition === 'Non-Responsive') {
        return getNextUnviewedIndex();
      } else if (condition === 'Aligned') {
        let sortedCats = Object.keys(userCategoryPreferences).sort((a, b) => userCategoryPreferences[b] - userCategoryPreferences[a]);
        let targetCat = sortedCats.find(cat => userCategoryPreferences[cat] > 0);
        let foundIndex = targetCat ? activeQueue.findIndex((v, i) => v.category === targetCat && !viewedIndices.has(i)) : -1;
        return foundIndex !== -1 ? foundIndex : getNextUnviewedIndex();
      } else {
        let sortedCats = Object.keys(userCategoryPreferences).sort((a, b) => userCategoryPreferences[a] - userCategoryPreferences[b]);
        let targetCat = sortedCats.find(cat => userCategoryPreferences[cat] <= 0);
        let foundIndex = targetCat ? activeQueue.findIndex((v, i) => v.category === targetCat && !viewedIndices.has(i)) : -1;
        return foundIndex !== -1 ? foundIndex : getNextUnviewedIndex();
      }
    }

    function preloadUpcomingVideo() {
      if (sessionEnded || !activeQueue.length) return;
      const nextIdx = predictNextQueueIndex();
      if (nextIdx < 0 || !activeQueue[nextIdx]) return;
      const nextSrc = activeQueue[nextIdx].src;
      if (nextSrc && preloaderVideo.getAttribute('src') !== nextSrc) {
        preloaderVideo.src = nextSrc;
        preloaderVideo.load();
      }
    }

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(totalSecs) {
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function startBlockTimer() {
      clearInterval(timerInterval);
      remainingSeconds = BLOCK_DURATION_SECONDS;
      document.getElementById('block-timer').innerText = formatTime(remainingSeconds);

      timerInterval = setInterval(() => {
        remainingSeconds--;
        if (remainingSeconds < 0) remainingSeconds = 0;
        document.getElementById('block-timer').innerText = formatTime(remainingSeconds);

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          endSession('timer_7min_expired');
        }
      }, 1000);
    }

    function startSession() {
      participantId = document.getElementById('participant-id').value.trim() || "Anonymous";
      condition = document.getElementById('condition-select').value;
      sessionEnded = false;
      sessionData = [];
      userCategoryPreferences = {};

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';

      if (condition === 'Non-Responsive') {
        activeQueue = [...videoSubsets["Non-Responsive"]];
      } else if (condition === 'Aligned') {
        activeQueue = shuffleArray(videoSubsets["Aligned"]);
      } else {
        activeQueue = shuffleArray(videoSubsets["Misaligned"]);
      }

      queueIndex = 0;
      sequencePosition = 1;
      viewedIndices.clear();
      viewHistory = [];
      
      setupVideoListeners();
      startBlockTimer();
      loadVideo();
    }

    function setupVideoListeners() {
      const videoElem = document.getElementById('feed-video');
      if (videoElem.dataset.listenerAttached) return;
      videoElem.addEventListener('seeked', () => {
        if (videoElem.currentTime < 0.5) loopCount++;
      });
      videoElem.dataset.listenerAttached = "true";
    }

    function loadVideo() {
      if (sessionEnded) return;
      cleanupActiveVideo();

      viewedIndices.add(queueIndex);
      const currentVid = activeQueue[queueIndex];
      const videoElem = document.getElementById('feed-video');
      
      videoElem.src = currentVid.src;
      document.getElementById('video-author').innerText = currentVid.author;
      document.getElementById('video-title').innerText = currentVid.title;
      
      currentPostComments = generateCommentsForVideo(currentVid.id);

      isLiked = isDisliked = isSaved = isFollowed = hasOpenedCommentsThisView = false;
      loopCount = 0;
      document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active-like', 'active-dislike', 'active-generic'));
      
      const profileBtn = document.getElementById('profile-btn');
      const followBadge = document.getElementById('follow-badge');
      profileBtn.classList.remove('is-following');
      followBadge.innerText = '+';

      document.getElementById('prev-btn').disabled = viewHistory.length === 0;

      videoStartTime = Date.now();
      videoElem.play().catch(e => console.log("Autoplay check:", e));
      preloadUpcomingVideo();
    }

    function generateCommentsForVideo(videoId) {
      let seed = 0;
      for (let i = 0; i < videoId.length; i++) {
        seed += videoId.charCodeAt(i);
      }
      let shuffled = [...commentPool];
      for (let i = shuffled.length - 1; i > 0; i--) {
        let j = (seed + i) % shuffled.length;
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      let count = 3 + (seed % 3);
      return shuffled.slice(0, count).map((c, index) => ({
        user: c.user,
        text: c.text,
        likes: 5 + ((seed * (index + 1)) % 120),
        liked: false
      }));
    }

    function togglePlayPause() {
      const videoElem = document.getElementById('feed-video');
      if (videoElem.paused) {
        videoElem.play();
        logAction('play');
      } else {
        videoElem.pause();
        logAction('pause');
      }
    }

    function toggleLike() {
      if (isDisliked) toggleDislike();
      isLiked = !isLiked;
      const cat = activeQueue[queueIndex].category;
      if (isLiked) {
        document.getElementById('like-btn').classList.add('active-like');
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 3;
        logAction('like');
      } else {
        document.getElementById('like-btn').classList.remove('active-like');
        userCategoryPreferences[cat] = Math.max(-5, (userCategoryPreferences[cat] || 0) - 3);
        logAction('unlike');
      }
      preloadUpcomingVideo();
    }

    function toggleDislike() {
      if (isLiked) toggleLike();
      isDisliked = !isDisliked;
      const cat = activeQueue[queueIndex].category;
      if (isDisliked) {
        document.getElementById('dislike-btn').classList.add('active-dislike');
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) - 10;
        logAction('not_interested');
      } else {
        document.getElementById('dislike-btn').classList.remove('active-dislike');
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 10;
        logAction('undo_not_interested');
      }
      preloadUpcomingVideo();
    }

    function toggleSave() {
      isSaved = !isSaved;
      const cat = activeQueue[queueIndex].category;
      if (isSaved) {
        document.getElementById('save-btn').classList.add('active-generic');
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 4;
        logAction('save');
      } else {
        document.getElementById('save-btn').classList.remove('active-generic');
        logAction('unsave');
      }
      preloadUpcomingVideo();
    }

    function toggleFollow() {
      isFollowed = !isFollowed;
      const cat = activeQueue[queueIndex].category;
      const profileBtn = document.getElementById('profile-btn');
      const followBadge = document.getElementById('follow-badge');

      if (isFollowed) {
        profileBtn.classList.add('is-following');
        followBadge.innerText = '✓';
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 5;
        logAction('follow');
      } else {
        profileBtn.classList.remove('is-following');
        followBadge.innerText = '+';
        logAction('unfollow');
      }
      preloadUpcomingVideo();
    }

    function openComments() {
      document.getElementById('feed-video').pause();
      const cat = activeQueue[queueIndex].category;
      if (!hasOpenedCommentsThisView) {
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 1;
        hasOpenedCommentsThisView = true;
      }
      logAction('open_comments');
      renderComments();
      document.getElementById('comments-drawer').style.display = 'flex';
      preloadUpcomingVideo();
    }

    function closeComments() {
      document.getElementById('comments-drawer').style.display = 'none';
      document.getElementById('feed-video').play();
    }

    function renderComments() {
      const container = document.getElementById('comments-list-container');
      document.getElementById('comments-title-count').innerText = `Comments (${currentPostComments.length})`;
      container.innerHTML = '';
      currentPostComments.forEach((c, idx) => {
        container.innerHTML += `
          <div class="comment-item">
            <div class="comment-avatar">👤</div>
            <div class="comment-content">
              <div class="comment-user">${c.user}</div>
              <div class="comment-text">${c.text}</div>
            </div>
            <button class="comment-like-btn ${c.liked ? 'liked' : ''}" onclick="toggleCommentLike(${idx})">
              <span>❤️</span>
              <span>${c.likes}</span>
            </button>
          </div>
        `;
      });
    }

    function toggleCommentLike(idx) {
      currentPostComments[idx].liked = !currentPostComments[idx].liked;
      currentPostComments[idx].likes += currentPostComments[idx].liked ? 1 : -1;
      const cat = activeQueue[queueIndex].category;
      if (currentPostComments[idx].liked) {
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 1;
        logAction('like_comment');
      } else {
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) - 1;
        logAction('unlike_comment');
      }
      renderComments();
      preloadUpcomingVideo();
    }

    function openShareModal() {
      document.getElementById('feed-video').pause();
      document.getElementById('btn-share-friends').classList.remove('selected');
      document.getElementById('btn-repost').classList.remove('selected');
      document.getElementById('share-modal').style.display = 'block';
    }

    function closeShareModal() {
      document.getElementById('share-modal').style.display = 'none';
      document.getElementById('feed-video').play();
    }

    function executeShare(actionType) {
      const cat = activeQueue[queueIndex].category;
      if (actionType === 'share_to_friends') {
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 2;
        document.getElementById('btn-share-friends').classList.add('selected');
      } else if (actionType === 'repost_to_feed') {
        userCategoryPreferences[cat] = (userCategoryPreferences[cat] || 0) + 1;
        document.getElementById('btn-repost').classList.add('selected');
      }

      logAction(actionType);
      preloadUpcomingVideo();

      setTimeout(() => {
        closeShareModal();
      }, 250);
    }

    function refreshFeed() {
      logAction('refresh');
      sequencePosition++;
      
      if (condition === 'Non-Responsive') {
        activeQueue = [...videoSubsets["Non-Responsive"]];
      } else if (condition === 'Aligned') {
        activeQueue = shuffleArray(videoSubsets["Aligned"]);
      } else {
        activeQueue = shuffleArray(videoSubsets["Misaligned"]);
      }
      queueIndex = 0;
      viewedIndices.clear();
      viewHistory = [];
      
      loadVideo();
    }

    function logAction(actionType, probeRating = null) {
      if (!activeQueue[queueIndex]) return;
      const currentVid = activeQueue[queueIndex];
      const videoElem = document.getElementById('feed-video');
      const dwellTime = ((Date.now() - videoStartTime) / 1000).toFixed(2);
      const videoDuration = videoElem.duration ? videoElem.duration.toFixed(2) : 0;
      const percentWatched = videoDuration > 0 ? Math.min(100, ((dwellTime / videoDuration) * 100)).toFixed(1) : 0;

      sessionData.push({
        participantId: participantId,
        condition: condition,
        timestamp: new Date().toISOString(),
        sequencePosition: sequencePosition,
        videoId: currentVid.id,
        author: currentVid.author,
        category: currentVid.category,
        action: actionType,
        watchTimeSeconds: dwellTime,
        videoDurationSeconds: videoDuration,
        percentWatched: percentWatched,
        loopCount: loopCount,
        algorithmStateScore: userCategoryPreferences[currentVid.category] || 0,
        perceivedAgencyProbe: probeRating !== null ? probeRating : ""
      });
    }

    function nextVideo() {
      logAction('scroll_next');
      viewHistory.push(queueIndex);
      sequencePosition++;

      if (sequencePosition % 10 === 0) {
        triggerProbe();
        return;
      }

      advanceQueue();
    }

    function triggerProbe() {
      const videoElem = document.getElementById('feed-video');
      videoElem.pause();
      document.getElementById('probe-modal').style.display = 'flex';
    }

    function submitProbe(rating) {
      logAction('in_feed_probe_submitted', rating);
      document.getElementById('probe-modal').style.display = 'none';
      advanceQueue();
    }

    function advanceQueue() {
      if (viewedIndices.size >= activeQueue.length) {
        if (condition === 'Non-Responsive') {
          activeQueue = [...videoSubsets["Non-Responsive"]];
        } else if (condition === 'Aligned') {
          activeQueue = shuffleArray(videoSubsets["Aligned"]);
        } else {
          activeQueue = shuffleArray(videoSubsets["Misaligned"]);
        }
        viewedIndices.clear();
        queueIndex = 0;
        loadVideo();
        return;
      }

      if (condition === 'Non-Responsive') {
        queueIndex = getNextUnviewedIndex();
      } else if (condition === 'Aligned') {
        let sortedCats = Object.keys(userCategoryPreferences).sort((a, b) => userCategoryPreferences[b] - userCategoryPreferences[a]);
        let targetCat = sortedCats.find(cat => userCategoryPreferences[cat] > 0);
        let foundIndex = targetCat ? activeQueue.findIndex((v, i) => v.category === targetCat && !viewedIndices.has(i)) : -1;
        queueIndex = foundIndex !== -1 ? foundIndex : getNextUnviewedIndex();
      } else if (condition === 'Misaligned') {
        let sortedCats = Object.keys(userCategoryPreferences).sort((a, b) => userCategoryPreferences[a] - userCategoryPreferences[b]);
        let targetCat = sortedCats.find(cat => userCategoryPreferences[cat] <= 0);
        let foundIndex = targetCat ? activeQueue.findIndex((v, i) => v.category === targetCat && !viewedIndices.has(i)) : -1;
        queueIndex = foundIndex !== -1 ? foundIndex : getNextUnviewedIndex();
      }

      loadVideo();
    }

    function prevVideo() {
      if (viewHistory.length === 0) return;
      logAction('scroll_previous');
      sequencePosition++;
      queueIndex = viewHistory.pop();
      loadVideo();
    }

    function getNextUnviewedIndex() {
      let nextIdx = (queueIndex + 1) % activeQueue.length;
      let counter = 0;
      while (viewedIndices.has(nextIdx) && counter < activeQueue.length) {
        nextIdx = (nextIdx + 1) % activeQueue.length;
        counter++;
      }
      return nextIdx;
    }

    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toUpperCase() === 'E') {
        endSession('shortcut_end_block');
      }
    });

    function buildCSVString() {
      if (sessionData.length === 0) return "";
      const headers = Object.keys(sessionData[0]).join(",");
      const rows = sessionData.map(row =>
        Object.values(row)
          .map(val => `"${String(val).replace(/"/g, '""')}"`)
          .join(",")
      );
      return [headers, ...rows].join("\n");
    }

    function getCSVFilename() {
      const safeId = (participantId || "Anonymous").replace(/[^a-zA-Z0-9_-]/g, "_");
      const safeCond = (condition || "Unknown").replace(/[^a-zA-Z0-9_-]/g, "_");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      return `${safeId}_Condition_${safeCond}_${stamp}.csv`;
    }

    async function uploadCSVToCloud(csvContent, filename) {
      const statusEl = document.getElementById('upload-status');

      if (!csvContent) {
        statusEl.innerText = "No interaction rows recorded for this block.";
        return;
      }

      if (!UPLOAD_ENDPOINT_URL) {
        statusEl.innerText = "Cloud endpoint not configured yet. Use the backup download button below or set UPLOAD_ENDPOINT_URL.";
        return;
      }

      statusEl.innerText = `Uploading ${filename} to cloud folder...`;

      try {
        await fetch(UPLOAD_ENDPOINT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            participantId,
            condition,
            filename,
            csv: csvContent
          })
        });
        statusEl.innerText = `Sent ${filename} to the study cloud folder.`;
      } catch (err) {
        console.error("Cloud upload error:", err);
        statusEl.innerText = "Cloud upload failed. Please use the backup CSV download button below.";
      }
    }

    function endSession(reason = 'manual_end_block') {
      if (sessionEnded) return;
      sessionEnded = true;
      clearInterval(timerInterval);

      logAction(reason);

      cleanupActiveVideo();
      preloaderVideo.removeAttribute('src');
      preloaderVideo.load();

      document.getElementById('probe-modal').style.display = 'none';
      document.getElementById('comments-drawer').style.display = 'none';
      document.getElementById('share-modal').style.display = 'none';
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('end-screen').style.display = 'block';

      const csvContent = buildCSVString();
      const filename = getCSVFilename();
      uploadCSVToCloud(csvContent, filename);
    }

    function downloadCSV() {
      const csvContent = buildCSVString();
      if (!csvContent) {
        alert("No data recorded.");
        return;
      }
      const filename = getCSVFilename();
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
